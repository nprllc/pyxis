# Ta liste de surveillance : toujours affichée, même si le score est faible.
watchlist: [EUNL.DE, ASML.AS, SAP.DE, ITX.MC, NOVO-B.CO, AI.PA]

# Indicateurs macro (séries FRED, téléchargées sans clé).
macro:
  ecb_rate: ECBDFR                     # taux de dépôt BCE
  eu_inflation_index: CP0000EZ19M086NEST  # indice des prix zone euro (on calcule le glissement sur 12 mois)
  eu_unemployment: LRHUTTTTEZM156S     # chômage zone euro
  us_curve: T10Y2Y                     # écart taux 10 ans - 2 ans (États-Unis)
  us_unemployment: UNRATE              # chômage États-Unis

# Fondamentaux et avis des analystes : rafraîchis chaque jour
# (mettre un nombre plus grand si Yahoo se met à bloquer les requêtes).
fundamentals_max_age_days: 1

# Noms lisibles pour les ETF (Yahoo donne parfois des noms tronqués).
names:
  EUNL.DE: iShares Core MSCI World
  VWCE.DE: Vanguard FTSE All-World
  SXR8.DE: iShares Core S&P 500
  IS3N.DE: iShares Core MSCI Emerging Markets
  EXSA.DE: iShares STOXX Europe 600
  IUSN.DE: iShares MSCI World Small Cap

# ---------------------------------------------------------------------------
# Relais de la veille (pipeline/veille.py), utilisé seulement si la veille Claude
# du matin n'est pas arrivée. Sources anglophones et francophones de référence.
veille:
  feeds:
    - { name: "BCE", url: "https://www.ecb.europa.eu/rss/press.html", lang: en }
    - { name: "Réserve fédérale", url: "https://www.federalreserve.gov/feeds/press_all.xml", lang: en }
    - { name: "Financial Times", url: "https://www.ft.com/markets?format=rss", lang: en }
    - { name: "Bloomberg", url: "https://feeds.bloomberg.com/markets/news.rss", lang: en }
    - { name: "CNBC Marchés", url: "https://www.cnbc.com/id/10000664/device/rss/rss.html", lang: en }
    - { name: "CNBC Économie", url: "https://www.cnbc.com/id/20910258/device/rss/rss.html", lang: en }
    - { name: "MarketWatch", url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", lang: en }
    - { name: "Le Monde Économie", url: "https://www.lemonde.fr/economie/rss_full.xml", lang: fr }
    - { name: "Les Échos Marchés", url: "https://syndication.lesechos.fr/rss/rss_finance-marches.xml", lang: fr }
    - { name: "BFM Business", url: "https://www.bfmtv.com/rss/economie/", lang: fr }
  # Modèles essayés dans l'ordre pour rédiger le digest. Un modèle n'est utilisé que si sa clé
  # existe dans les secrets du dépôt (nom indiqué dans key_env). Sans aucune clé : revue de presse.
  # provider : anthropic, openai, mistral, gemini, ou openai-compatible (avec base_url).
  providers:
    - { provider: anthropic, label: "Claude", model: "claude-sonnet-5-5", key_env: ANTHROPIC_API_KEY }
    - { provider: mistral, label: "Mistral", model: "mistral-large-latest", key_env: MISTRAL_API_KEY }
    - { provider: gemini, label: "Gemini", model: "gemini-flash-latest", key_env: GEMINI_API_KEY }
    - { provider: openai, label: "OpenAI", model: "gpt-4.1-mini", key_env: OPENAI_API_KEY }
