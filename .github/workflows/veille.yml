# Relais de la veille : si la veille Claude du matin n'est pas arrivée, en écrit une autre
# (modèle de secours si une clé existe, sinon revue de presse) et republie le site.
name: Veille (relais)

on:
  schedule:
    - cron: "15 8 * * 1-5"   # 8 h 15 UTC (9 h 15 à Madrid en hiver), du lundi au vendredi
  workflow_dispatch:
    inputs:
      force:
        description: "Réécrire la veille même si celle du jour existe"
        type: boolean
        default: false
      essai:
        description: "Essai : montrer le résultat dans le journal sans rien publier"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pyxis-update
  cancel-in-progress: false

jobs:
  veille:
    name: Veille et publication
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Installer les dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Écrire la veille si besoin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m pipeline.veille ${{ inputs.force && '--force' || '' }} ${{ inputs.essai && '--dry' || '' }}

      - name: Enregistrer
        id: save
        run: |
          git config user.name "pyxis-bot"
          git config user.email "pyxis-bot@users.noreply.github.com"
          git add site/data/brief.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Veille (relais) du $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.save.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Rester actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable veille.yml --repo "${{ github.repository }}" || true
