# Met à jour les données de Pyxis et publie le site sur GitHub Pages.
# Se lance tout seul chaque soir de semaine après la clôture des bourses américaines,
# à chaque modification du code, ou à la main (onglet Actions > « Mise à jour » > Run workflow).
name: Mise à jour

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22 h 17 UTC, du lundi au vendredi
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:   # les fichiers produits par la mise à jour elle-même (la veille, elle, republie le site)
      - "site/data/universe.json"
      - "site/data/macro.json"
      - "site/data/meta.json"
      - "site/data/history.json"
      - "site/data/backtest.json"
      - "pipeline/cache/**"

permissions:
  contents: write   # pour enregistrer les nouvelles données dans le dépôt
  pages: write
  id-token: write
  actions: write    # pour se réactiver soi-même (voir la dernière étape)

concurrency:
  group: pyxis-update
  cancel-in-progress: false

jobs:
  donnees:
    name: Données et publication
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Installer les dépendances
        run: pip install -r pipeline/requirements.txt

      - name: Tests
        run: python -m pytest pipeline/tests -q

      - name: Récupérer les données et calculer les scores
        id: build
        continue-on-error: true   # si les sources échouent, on publie quand même les données de la veille
        run: python -m pipeline.build

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "pyxis-bot"
          git config user.email "pyxis-bot@users.noreply.github.com"
          git add site/data pipeline/cache
          if git diff --staged --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données du $(date -u +%Y-%m-%d)"
            git pull --rebase -X theirs   # en cas de conflit sur les fichiers générés, la version qui vient d'être calculée gagne
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub met en pause les tâches planifiées d'un dépôt public après 60 jours sans activité.
      # Se réactiver à chaque passage remet ce compteur à zéro : le site tourne sans limite de durée.
      - name: Rester actif
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update.yml --repo "${{ github.repository }}" || true
